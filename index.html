<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCRIPTORIA</title><style>body{margin:0;background:#071726;color:#eaf5f8;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:2rem;text-align:center}.dot{width:16px;height:16px;border-radius:50%;background:#22d7df;margin:0 auto 1rem;animation:p 1s infinite alternate}@keyframes p{to{transform:scale(1.5);opacity:.5}}</style></head><body><div class="box"><div class="dot"></div><h2>A carregar SCRIPTORIA…</h2><p>Ecossistema agêntico pedagógico · v7</p></div><script>(async()=>{try{const parts=[];for(let i=0;i<6;i++){const r=await fetch(`/chunks/${i}.txt`,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar chunk '+i);parts.push((await r.text()).trim())}const b64=parts.join('');const b=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const full=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(full);document.close()}catch(e){document.body.innerHTML='<pre style="padding:2rem;white-space:pre-wrap">Erro ao carregar SCRIPTORIA: '+String(e)+'</pre>'}})();</script></body></html>
